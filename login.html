<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Lions JLW</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body class="pagina-cuenta">

  <main class="caja-cuenta">
    <a href="index.html"><img src="images/Lions_Negro.png" alt="Lions JLW" class="logo-img"></a>
    <h1>Iniciar sesión</h1>

    <p id="mensaje" class="mensaje"></p>

    <form id="formLogin" class="formulario">
      <label for="email">Correo</label>
      <input type="email" id="email" required>

      <label for="password">Contraseña</label>
      <input type="password" id="password" required>

      <button type="submit" class="boton">ENTRAR</button>
    </form>

    <p class="cambio-cuenta">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
  </main>

  <script src="api.js"></script>
  <script src="login.js"></script>
</body>
</html>
