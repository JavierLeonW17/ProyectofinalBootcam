<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis pedidos | Lions JLW</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <header class="topbar">
    <nav class="nav contenedor">
      <a href="index.html" class="logo">
        <img src="images/Lions_Negro.png" alt="Lions JLW" class="logo-img">
      </a>
      <div class="usuario-nav">
        <span id="saludo"></span>
        <button id="botonSalir" class="boton-simple">Cerrar sesión</button>
      </div>
    </nav>
  </header>

  <main class="contenedor pagina-pedidos">
    <section>
      <h2 id="tituloFormulario">Nuevo pedido</h2>

      <p id="mensaje" class="mensaje"></p>

      <form id="formPedido" class="formulario">
        <label for="producto">Producto</label>
        <select id="producto" required>
          <option value="camiseta">Camiseta</option>
          <option value="gorra">Gorra</option>
          <option value="mug">Mug</option>
          <option value="termo">Termo</option>
        </select>

        <label for="tecnica">Técnica</label>
        <select id="tecnica">
          <option value="dtf">DTF</option>
          <option value="sublimacion">Sublimación</option>
          <option value="plancha">Plancha de calor</option>
        </select>

        <label for="cantidad">Cantidad</label>
        <input type="number" id="cantidad" min="1" value="1" required>

        <label for="descripcion">¿Qué quieres estampar?</label>
        <textarea id="descripcion" rows="4" required></textarea>

        <button type="submit" id="botonGuardar" class="boton">ENVIAR PEDIDO</button>
        <button type="button" id="botonCancelarEdicion" class="boton-simple oculto">Cancelar edición</button>
      </form>
    </section>

    <section class="lista-pedidos">
      <h2>Mis pedidos</h2>
      <p id="sinPedidos" class="sin-pedidos">Todavía no tienes pedidos.</p>

      <div id="cardsPedidos" class="cards-pedidos"></div>
    </section>
  </main>

  <!-- Detalle de un pedido -->
  <dialog id="detallePedido" class="detalle-pedido">
    <h3>Detalle del pedido</h3>
    <div id="contenidoDetalle"></div>
    <button id="botonCerrarDetalle" class="boton-simple">Cerrar</button>
  </dialog>

  <script src="api.js"></script>
  <script src="pedidos.js"></script>
</body>
</html>
