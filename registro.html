<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta | Lions JLW</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body class="pagina-cuenta">

  <main class="caja-cuenta">
    <a href="index.html"><img src="images/Lions_Negro.png" alt="Lions JLW" class="logo-img"></a>
    <h1>Crear cuenta</h1>

    <p id="mensaje" class="mensaje"></p>

    <form id="formRegistro" class="formulario">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" required>

      <label for="email">Correo</label>
      <input type="email" id="email" required>

      <label for="telefono">Teléfono</label>
      <input type="tel" id="telefono" required>

      <label for="password">Contraseña</label>
      <input type="password" id="password" required>
      <small>Mínimo 8 caracteres, con mayúscula, minúscula, número y un símbolo.</small>

      <button type="submit" class="boton">REGISTRARME</button>
    </form>

    <p class="cambio-cuenta">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
  </main>

  <script src="api.js"></script>
  <script src="registro.js"></script>
</body>
</html>
